<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./index.css">
        <title>TOS UI</title>
    </head>
    <body>
        <div id="status">No event selected</div>
        <div class="panels-container">
            <div class="panel initial" id="nothing-loaded">
                <div class="button" id="button-load-event">Load Event From TSH</div>
            </div>
            <div class="panel" id="event-selected">
                <div class="button" id="button-retry-data">Retry loading data</div>
            </div>
        </div>
        <div class="feedback-container">
            > <div id="feedback"></div>
        </div>
        <script src="index.js" type="module"></script>
    </body>
</html>
