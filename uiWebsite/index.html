<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./index.css">
        <title>TOS UI</title>
    </head>
    <body>
        <div id="status">No event selected</div>
        <div class="panels-container">
            <div class="button-board panel initial">Connecting ...</div>
            <div class="button-board panel" id="nothing-loaded">
                <div class="button normal-button clickable" id="button-load-event">Load Event From TSH</div>
            </div>
            <div class="button-board panel" id="event-selected">
                <div class="button normal-button clickable" id="button-unload-event">Reset</div>
                <div class="button normal-button clickable" id="button-retry-data">Retry loading data</div>
                <div class="button form-button" id="button-build-data">
                    <div class="button-fragment form-button-title clickable">Build data</div>
                    <div class="form-button-arrow clickable">></div>
                    <div class="button-form-container">
                        <div class="button-form">
                            <div class="form-line">
                                <label for="sggog_addr">SGGOG Address</label>
                                <input type="text" name="sggog_addr" id="form-sggog-addr" size="20">
                            </div>
                            <div class="form-line">
                                <label for="sggog_addr">Fast mode</label>
                                <input type="checkbox" name="api-fast-mode" id="form-api-fast-mode" size="20">
                            </div>
                        </div>
                        <div class="form-x-column"><div class="clickable"><div class="form-x "></div></div></div>
                    </div>
                    
                </div>
            </div>
            <div class="button-board panel" id="data-loaded">
                <div class="button" id="button normal-button clickable">Reset</div>
            </div>
        </div>
        <div class="feedback-container">
            <bold>></bold> <div id="feedback"></div>
        </div>
        <script src="index.js" type="module"></script>
    </body>
</html>
