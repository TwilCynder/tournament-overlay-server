query EventStandingsQuery($slug: String!) {
  event(slug: $slug) {
    id
    name
    tournament {
      name
    }
    videogame {
      name
      id
    }
    entrants(query: {perPage: 192}) {
      nodes {
        name
        participants {
          player {
            id
            gamerTag
          }
        }
      }
    }
  }
}